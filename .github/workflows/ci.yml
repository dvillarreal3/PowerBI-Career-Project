name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run linter (flake8)
        run: |
          echo "Running flake8..."
          # Fail the job if flake8 reports any issues
          python -m pip install --upgrade pip
          pip install flake8
          flake8 src tests

      - name: Run tests
        run: |
          pytest -q
